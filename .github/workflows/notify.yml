on:
  # https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onworkflow_callinputs
  workflow_call:
    inputs:
      conclusion:
        required: true
        type: string
      package:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-output-parameter
      - id: e
        run: |
          s="$(cat ./.github/telegram-notify.md)"
          s="${s//\"/\\\"}"
          s="${s//$'\n'/\\n}"
          echo "notify_template=\"$s\"" >> "$GITHUB_OUTPUT"
      - uses: up9cloud/action-notify@master
        env:
          GITHUB_JOB_STATUS: ${{ inputs.conclusion }}
          PACKAGE_NAME: ${{ inputs.package }}
          TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
          TELEGRAM_TEMPLATE_CONTENT: ${{ steps.e.outputs.notify_template }}
          TELEGRAM_PARSE_MODE: md
