name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
    paths:
      - .github/workflows/www-firebase-hosting-merge.yml
      - .github/workflows/notify.yml
      - "packages/www/**"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm -w packages/www i
          npm -w packages/www run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: ./packages/www
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_XX_3CM }}'
          channelId: live
          projectId: xx-3cm
      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-output-parameter
      - run: |
          s="$(cat ./.github/telegram-notify.md)"
          s="${s//\"/\\\"}"
          s="${s//$'\n'/\\n}"
          echo "notify_template=\"$s\"" >> "$GITHUB_OUTPUT"
    # https://github.com/orgs/community/discussions/77915#discussioncomment-8409702
    continue-on-error: true
  # https://docs.github.com/en/actions/sharing-automations/reusing-workflows#calling-a-reusable-workflow
  notify:
    needs: build_and_deploy
    uses: ./.github/workflows/notify.yml
    # https://docs.github.com/en/actions/sharing-automations/reusing-workflows#passing-inputs-and-secrets-to-a-reusable-workflow
    secrets: inherit
    with:
      conclusion: ${{ needs.build_and_deploy.result }}
      package: www
      template: ${{ needs.build_and_deploy.notify_template }}
