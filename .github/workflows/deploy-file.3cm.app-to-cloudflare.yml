env:
  PACKAGE_ID: file.3cm.app
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-file.3cm.app-to-cloudflare.yml
      - packages/file.3cm.app/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # environment: dev
          workingDirectory: packages/${{env.PACKAGE_ID}}
          command: |
            pages deploy docs --project-name=file --branch=master
    continue-on-error: true
  notify:
    needs: deploy
    steps:
      - uses: ./.github/workflows/notify.yml
        secrets: inherit
        with:
          conclusion: ${{ needs.deploy.result }}
          package: ${{env.PACKAGE_ID}}
