name: Deploy to Fleek
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-bash.3cm.app-to-fleek.yml
      - packages/bash.3cm.app/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLEEK_TOKEN: ${{ secrets.FLEEK_TOKEN }}
      FLEEK_PROJECT_ID: ${{ secrets.PACKAGE_BASH_FLEEK_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: |
          npm -w packages/bash.3cm.app i
          npx -w packages/bash.3cm.app fleek sites deploy
      - id: extract_deployment_id
        run: |
          slug=$(jq -r .sites[0].slug ./packages/bash.3cm.app/fleek.config.json)
          deployment_id=$(npx -w packages/bash.3cm.app fleek sites deployments --slug $slug|grep RELEASE_COMPLETED|head -n 1| awk '{split($0,a," "); print a[1]}')
          echo "deployment_id=${deployment_id}" >> $GITHUB_OUTPUT
      - uses: infraway/create-dns-record@v2.0
        with:
          type: "CNAME"
          name: "bash.3cm.app"
          content: "${{ steps.extract_deployment_id.outputs.deployment_id }}.fleekcdn.xyz"
          ttl: 1
          proxied: false
          token: ${{ secrets.CLOUDFLARE_TOKEN }}
          zone: ${{ secrets.CLOUDFLARE_ZONE }}
  notify:
    needs: deploy
    uses: ./.github/workflows/notify.yml
    secrets: inherit
    with:
      conclusion: ${{ needs.deploy.result }}
      package: bash.3cm.app
