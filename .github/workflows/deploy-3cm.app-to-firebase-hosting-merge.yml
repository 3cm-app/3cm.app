env:
  PACKAGE_ID: 3cm.app
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-3cm.app-to-firebase-hosting-merge.yml
      - packages/${{env.PACKAGE_ID}}/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm -w packages/${{env.PACKAGE_ID}} i
          npm -w packages/${{env.PACKAGE_ID}} run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: ./packages/${{env.PACKAGE_ID}}
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_XX_3CM }}'
          channelId: live
          projectId: xx-3cm
    continue-on-error: true
  notify:
    needs: deploy
    uses: ./.github/workflows/notify.yml
    secrets: inherit
    with:
      conclusion: ${{ needs.deploy.result }}
      package: ${{env.PACKAGE_ID}}
